version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pazaryeri_db
    environment:
      POSTGRES_DB: pazaryeridb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./Backend/PazarYeriOtomasyon.API
      dockerfile: Dockerfile
    container_name: pazaryeri_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=pazaryeridb;Username=admin;Password=secretpassword
    env_file:
      - .env
    ports:
      - "5000:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:20
    container_name: pazaryeri_frontend
    working_dir: /app
    volumes:
      - ./Frontend:/app
    ports:
      - "3000:5173"
    depends_on:
      - backend
    command: sh -c "yarn install && yarn dev --host"
    restart: unless-stopped

volumes:
  pgdata:
